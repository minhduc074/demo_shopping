<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shopee-style Demo Viewer</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Shopee Demo Screenshots</h1>
      <p>Quick preview of the demo screens included with the project.</p>
      <p class="updated">Images last updated: 2026-03-30 15:23:30</p>
    </div>
  </header>

  <main class="container gallery">
    <figure>
      <img src="images/login.png" alt="Login page">
      <figcaption>Login</figcaption>
    </figure>

    <figure>
      <img src="images/login-modal.png" alt="Login modal">
      <figcaption>Login Modal</figcaption>
    </figure>

    <figure>
      <img src="images/home.png" alt="Home">
      <figcaption>Home</figcaption>
    </figure>

    <figure>
      <img src="images/cart.png" alt="Cart drawer">
      <figcaption>Cart Drawer</figcaption>
    </figure>

    <figure>
      <img src="images/checkout.png" alt="Checkout">
      <figcaption>Checkout</figcaption>
    </figure>

    <figure>
      <img src="images/payment.png" alt="Payment">
      <figcaption>Payment / Stripe</figcaption>
    </figure>
  </main>

  <footer class="container footer">
    <p>Files located in <a href="./images">./images</a></p>
  </footer>
</body>
</html>
